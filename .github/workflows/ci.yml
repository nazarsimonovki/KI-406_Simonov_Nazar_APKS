name: CMake CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        run: ci.bat
        shell: cmd
      - name: Build and test on Unix
        if: runner.os != 'Windows'
        run: bash ./ci.sh
        shell: bash
name: CMake CI

on:
  push:
    branches:
      - develop
      - master
      - "feature/**"
  pull_request:
    branches:
      - develop
      - master

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        run: .\ci.bat

      - name: Build and test on Unix
        if: runner.os != 'Windows'
        run: bash ./ci.sh

      - name: Upload hello artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-${{ matrix.os }}
          path: ${{ runner.os == 'Windows' && 'build/Release/hello.exe' || 'build/hello' }}

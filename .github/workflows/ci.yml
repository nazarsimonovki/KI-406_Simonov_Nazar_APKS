name: CMake CI

on:
  push:
    branches: [ develop, master, "feature/**" ]
  pull_request:
    branches: [ develop, master ]

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make ci.sh executable
        if: runner.os != 'Windows'
        run: chmod +x ./ci.sh
        shell: bash

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        run: ci.bat
        shell: cmd

      - name: Build and test on Unix
        if: runner.os != 'Windows'
        run: bash ./ci.sh
        shell: bash

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-app-${{ matrix.os }}
          path: |
            build/Release/hello.exe
            build/hello.exe
            build/hello
          if-no-files-found: ignore